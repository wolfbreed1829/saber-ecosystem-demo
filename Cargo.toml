[package]
name = "saber-ecosystem-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Navigator", "Clipboard", "MediaQueryList", "HtmlElement", "Element", "KeyboardEvent", "PointerEvent"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
